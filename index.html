<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120705">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Earth Core Sudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:opsz,wght@6..12,500;6..12,700;6..12,800;6..12,900&display=swap">
<style>
/* Layout: one portrait screen. HUD on top, the stone board as the hero, power tray and number pad below, all floating over a living molten-core canvas. Single dark world by design. */
:root{
  color-scheme: dark;
  --abyss:#120705;        /* deepest rock */
  --obsidian:#1d1110;     /* frames, chips */
  --obsidian-2:#2a1916;
  --stone:#f2e8d6;        /* board cells */
  --stone-peer:#e6d6bd;
  --stone-same:#cfe1f3;
  --ink:#2b1c16;          /* givens */
  --player:#1d5fae;       /* player entries */
  --lock-bg:#ffcf6e;      /* power-locked cells */
  --lock-ink:#5a2a00;
  --magma:#ff7a1a;        /* accent */
  --magma-hot:#ffb347;
  --text:#fbefe2;
  --muted:#c9ac98;
  --glow: 255,110,30;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--abyss);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#env{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding-inline:16px;padding-block:10px 12px;max-width:520px;margin:0 auto;box-sizing:border-box}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--magma-hot);outline-offset:2px}

/* HUD */
.hud{width:100%;display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 6px;border-radius:999px;background:linear-gradient(180deg,var(--obsidian-2),var(--obsidian));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 0 rgba(0,0,0,.45);font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.chip .ico svg{width:20px;height:20px}
.lives .ico{background:radial-gradient(circle at 35% 30%,#ff8a7a,#d92b2b 70%)}
.coins .ico{background:radial-gradient(circle at 35% 30%,#ffe9a0,#e9a21b 70%)}
.chip small{font-size:12px;font-weight:800;color:var(--muted);margin-left:2px}
.chip.unl small{color:#9fe3ff}
.hud .spacer{flex:1}
.iconbtn{width:42px;height:40px;border-radius:14px;background:linear-gradient(180deg,var(--obsidian-2),var(--obsidian));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 0 rgba(0,0,0,.45);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;fill:var(--text)}

.titlebar{width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.where{min-width:0}
.where .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--magma-hot);text-shadow:0 0 12px rgba(var(--glow),.6)}
.where h1{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.where .zone{font-size:13px;color:var(--muted);font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moves{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:78px;height:62px;border-radius:20px;background:radial-gradient(120% 120% at 50% 0%,#3a201a,var(--obsidian));box-shadow:inset 0 0 0 2px rgba(var(--glow),.45),0 0 22px rgba(var(--glow),.25),0 4px 0 rgba(0,0,0,.5)}
.moves b{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.moves span{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--muted)}
.moves.low b{color:#ff8f6b}
.moves.bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(1.12)}}

/* Board */
.boardwrap{--size:min(calc(100vw - 32px), calc(100vh - 360px), 470px);position:relative;width:var(--size);aspect-ratio:1;max-width:100%;flex:none}
@supports (height:100dvh){.boardwrap{--size:min(calc(100vw - 32px), calc(100dvh - 360px), 470px)}}
.frame{position:absolute;inset:-8px;border-radius:22px;background:linear-gradient(160deg,#3a2420,#140a08 60%);box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 34px rgba(var(--glow),.35),0 10px 30px rgba(0,0,0,.6),inset 0 0 18px rgba(var(--glow),.25)}
#board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);border-radius:14px;overflow:hidden;background:#5b4335;gap:1px}
.cell{position:relative;background:var(--stone);display:grid;place-items:center;font-weight:800;font-size:calc(var(--size) * .068);font-variant-numeric:tabular-nums;color:var(--player);line-height:1;transition:background-color .12s}
.cell:nth-child(9n+3),.cell:nth-child(9n+6){margin-right:2px}
.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){margin-bottom:2px}
.cell.given{color:var(--ink);font-weight:900}
.cell.peer{background:var(--stone-peer)}
.cell.same{background:var(--stone-same)}
.cell.sel{background:#ffd9a8;box-shadow:inset 0 0 0 3px var(--magma)}
.cell.locked{background:var(--lock-bg);color:var(--lock-ink);font-weight:900;box-shadow:inset 0 0 10px rgba(255,140,0,.55)}
.cell.locked.sel{box-shadow:inset 0 0 0 3px var(--magma),inset 0 0 10px rgba(255,140,0,.55)}
.cell.target{cursor:crosshair}
.cell.aim{background:#ffe7b8 !important;box-shadow:inset 0 0 0 2px #ff9a3c}
.cell .notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:calc(var(--size) * .026);font-weight:800;color:#7a5a46}
.cell .notes i{font-style:normal;display:grid;place-items:center}
.cell.pop{animation:pop .22s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.cell.burst{animation:burst .55s ease both;animation-delay:var(--d,0ms)}
@keyframes burst{0%{background:#fff3c9;transform:scale(.7)}40%{background:#ffb347;transform:scale(1.08)}100%{transform:scale(1)}}
.cell.win{animation:winwave .7s ease both;animation-delay:var(--d,0ms)}
@keyframes winwave{0%{transform:scale(1)}40%{transform:scale(.82);background:#ffcf6e}100%{transform:scale(1)}}
#board.shake{animation:shake .4s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:5;min-width:60%;max-width:92%;text-align:center;padding:14px 18px;border-radius:18px;background:rgba(29,17,16,.94);box-shadow:0 0 0 2px rgba(var(--glow),.5),0 12px 30px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--magma-hot);letter-spacing:.02em}
.toast span{font-size:14px;font-weight:700;color:var(--text)}

/* Mode strip */
.mode{width:100%;min-height:22px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--magma-hot)}
.mode button{padding:4px 12px;border-radius:999px;background:var(--obsidian-2);font-weight:900;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.mode button.on{background:var(--magma);color:#2a1004}

/* Powers */
.powers{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pw{position:relative;height:58px;border-radius:18px;background:linear-gradient(180deg,#43302a,#25150f);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .08s}
.pw:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.55)}
.pw svg{width:24px;height:24px;fill:var(--magma-hot)}
.pw em{font-style:normal;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pw .n{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--magma);color:#2a1004;font-weight:900;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.4);box-sizing:border-box}
.pw.empty .n{background:#5a4740;color:#cbb}
.pw.empty svg{opacity:.4}
.pw.armed{background:linear-gradient(180deg,#ff9a3c,#d9560e);box-shadow:0 0 18px rgba(var(--glow),.7),0 4px 0 rgba(0,0,0,.55)}
.pw.armed svg{fill:#2a1004}.pw.armed em{color:#2a1004}
.pw.active-notes{box-shadow:inset 0 0 0 2px var(--magma-hot),0 4px 0 rgba(0,0,0,.55)}

/* Pad */
.pad{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.key{height:50px;border-radius:16px;background:linear-gradient(180deg,#fff6e8,#e7d3b6);color:var(--ink);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums;box-shadow:inset 0 -3px 0 rgba(120,80,40,.25),0 4px 0 rgba(0,0,0,.5);transition:transform .08s}
.key:active{transform:translateY(2px);box-shadow:inset 0 -3px 0 rgba(120,80,40,.25),0 2px 0 rgba(0,0,0,.5)}
.key.pencil{background:linear-gradient(180deg,#d6ecff,#a9cbe8);color:#1d3f66}
.key.erase{background:linear-gradient(180deg,#4a332c,#2a1914);color:var(--text);display:grid;place-items:center}
.key.erase svg{width:24px;height:24px;fill:var(--text)}
.disabled{opacity:.45;pointer-events:none}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,4,3,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;box-sizing:border-box}
.sheet{width:min(420px,100%);max-height:calc(100% - 20px);overflow:auto;border-radius:26px;padding:22px 20px 20px;box-sizing:border-box;background:linear-gradient(180deg,#36221d,#1b0f0c);box-shadow:0 0 0 2px rgba(var(--glow),.45),0 0 40px rgba(var(--glow),.25),0 20px 50px rgba(0,0,0,.7);text-align:center;animation:rise .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(24px) scale(.94);opacity:0}}
.sheet h2{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;letter-spacing:.01em;text-wrap:balance;color:var(--magma-hot);text-shadow:0 3px 0 rgba(0,0,0,.45)}
.sheet p{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--text)}
.sheet .sub{color:var(--muted);font-size:14px}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btn{width:100%;min-height:56px;border-radius:18px;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 14px;box-sizing:border-box;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.hot{background:linear-gradient(180deg,#ffb347,#f0690f);color:#2a1004;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #8a3205}
.btn.cool{background:linear-gradient(180deg,#5b3f36,#3a2620);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 5px 0 #170b09}
.btn .cost{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.22);font-size:14px}
.btn .cost svg{width:16px;height:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{padding:10px 6px;border-radius:16px;background:rgba(0,0,0,.25)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rules{margin:14px 0 0;padding:0;list-style:none;text-align:left;display:flex;flex-direction:column;gap:9px}
.rules li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:14.5px;line-height:1.4}
.rules li b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--magma-hot);text-align:center}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.25);font-weight:800;font-size:15px;text-align:left}
.sw{width:50px;height:30px;border-radius:999px;background:#5a4740;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--magma)}.sw.on::after{transform:translateX(20px)}
.dev{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dev .btn{min-height:46px;font-size:14px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.levels button{height:40px;border-radius:12px;background:#3a2620;font-weight:900}
.levels button.cur{background:var(--magma);color:#2a1004}
.tag{display:inline-block;margin-top:2px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

@media (max-height:700px){
  .where h1{font-size:26px}.moves{height:54px}.moves b{font-size:28px}
  .pw{height:52px}.key{height:44px;font-size:23px}
  .boardwrap{--size:min(calc(100vw - 32px), calc(100vh - 330px), 470px)}
  @supports (height:100dvh){.boardwrap{--size:min(calc(100vw - 32px), calc(100dvh - 330px), 470px)}}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.rm *{animation:none !important;transition:none !important}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<canvas id="env" aria-hidden="true"></canvas>
<div id="app">
  <div class="hud">
    <div class="chip lives" id="livesChip" aria-label="Lives"><span class="ico"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.7 1.2-1.6 2.8-2.7 4.8-2.7 3.6 0 6.2 3.5 4.7 7.3C19.5 16.4 12 21 12 21z"/></svg></span><span id="livesVal">5</span><small id="livesSub"></small></div>
    <div class="chip coins" aria-label="Coins"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="#7a4b00" stroke-width="2"/><path d="M12 8v8" stroke="#7a4b00" stroke-width="2.2" stroke-linecap="round"/></svg></span><span id="coinVal">2,000</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="menuBtn" aria-label="Pause and settings"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  </div>

  <div class="titlebar">
    <div class="where" id="where">
      <div class="eyebrow" id="titleHold">Earth's Core</div>
      <h1 id="lvlTitle">Level 1</h1>
      <div class="zone" id="zone">Deep Molten Core</div>
    </div>
    <div class="moves" id="moves"><b id="movesVal">0</b><span>MOVES</span></div>
  </div>

  <div class="boardwrap" id="boardwrap">
    <div class="frame"></div>
    <div id="board" role="grid" aria-label="Sudoku board"></div>
    <div class="toast" id="toast"><b id="toastT"></b><span id="toastS"></span></div>
  </div>

  <div class="mode" id="mode"></div>

  <div class="powers" id="powers"></div>
  <div class="pad" id="pad"></div>
</div>
<div id="layer"></div>

<script>
(() => {
"use strict";
/* ===== Configuration (balance values live here, nowhere else) ===== */
const CONFIG = {
  maxLives: 5,                       // LOCKED
  regenMinutes: [5, 10, 15, 20, 25], // LOCKED
  powerCap: 10,                      // LOCKED
  plusMoves: 5,                      // LOCKED
  plusMovesPrice: 200,               // WORKING / BALANCE VALUE
  playAgainPrice: 500,               // WORKING / BALANCE VALUE
  unlimitedRewardMin: 30,            // WORKING / BALANCE VALUE
  testSave: { lives: 5, coins: 2000, powers: 3 } // DEVELOPMENT / PROTOTYPE
};
// Provisional playtest profiles (clue count and correction room vary per level; not a final algorithm)
const LEVELS = [
  { zone: "Deep Molten Core",          clues: 40, room: 9 },
  { zone: "Deep Molten Core",          clues: 37, room: 8 },
  { zone: "Deep Molten Core",          clues: 35, room: 10 },
  { zone: "Magma Chambers",            clues: 38, room: 6 },
  { zone: "Magma Chambers",            clues: 33, room: 9 },
  { zone: "Cooling Volcanic Rock",     clues: 34, room: 7 },
  { zone: "Cooling Volcanic Rock",     clues: 36, room: 5 },
  { zone: "Cooling Volcanic Rock",     clues: 31, room: 10 },
  { zone: "Early Crystal Formations",  clues: 32, room: 8 },
  { zone: "Early Crystal Formations",  clues: 30, room: 9 }
];
const POWERS = ["notes", "hammer", "arrow", "bomb", "reveal"];
const POWER_LABEL = { notes: "Notes", hammer: "Hammer", arrow: "Arrow", bomb: "Bomb", reveal: "Reveal" };
const ICON = {
  notes: '<svg viewBox="0 0 24 24"><path d="M4 17.5V20h2.5L17.8 8.7l-2.5-2.5L4 17.5zm16.7-9.8a1 1 0 0 0 0-1.4l-2-2a1 1 0 0 0-1.4 0l-1.6 1.6 3.4 3.4 1.6-1.6z"/></svg>',
  hammer: '<svg viewBox="0 0 24 24"><path d="M3 7.5 8.5 2l3 3-1.6 1.6 1.6 1.6L9.9 9.8 8.3 8.2 6.7 9.8 3 7.5z"/><path d="m10.6 10.5 1.4-1.4 9.4 9.4a1 1 0 0 1 0 1.4l-.1.1a1 1 0 0 1-1.4 0l-9.3-9.5z"/></svg>',
  arrow: '<svg viewBox="0 0 24 24"><path d="M12 2l4 4h-3v5h5V8l4 4-4 4v-3h-5v5h3l-4 4-4-4h3v-5H6v3l-4-4 4-4v3h5V6H8l4-4z"/></svg>',
  bomb: '<svg viewBox="0 0 24 24"><circle cx="10" cy="14" r="7"/><path d="M14.5 7.5 16 6l2 2-1.5 1.5z"/><path d="M17.5 5c.4-1.4 1.5-2.2 3-2" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" style="color:#ffcf6e"/></svg>',
  reveal: '<svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.2L20.5 9l-5 4 1.7 6.5L12 16l-5.2 3.5L8.5 13l-5-4 6.3-.8z"/></svg>',
  erase: '<svg viewBox="0 0 24 24"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7zm3.3 4.3-1 1L13 12l-1.7 1.7 1 1L14 13l1.7 1.7 1-1L15 12l1.7-1.7-1-1L14 11l-1.7-1.7z"/></svg>',
  coin: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ffd25a"/><circle cx="12" cy="12" r="6" fill="none" stroke="#a46a00" stroke-width="2"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path fill="#ff6b6b" d="M12 21s-7.5-4.6-9.5-9.2C1 8 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.7 1.2-1.6 2.8-2.7 4.8-2.7 3.6 0 6.2 3.5 4.7 7.3C19.5 16.4 12 21 12 21z"/></svg>'
};
const DEV_TOOLS = true; // test build

/* ===== Sudoku engine ===== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const RC = i => [Math.floor(i/9), i%9];
const BOX = i => { const [r,c]=RC(i); return Math.floor(r/3)*3+Math.floor(c/3); };
const POP = m => { let n=0; while(m){m&=m-1;n++;} return n; };
function search(grid, limit, rand){
  const g = grid.slice(), rows=Array(9).fill(0), cols=Array(9).fill(0), boxes=Array(9).fill(0);
  for(let i=0;i<81;i++) if(g[i]){ const [r,c]=RC(i), b=BOX(i), bit=1<<g[i]; rows[r]|=bit; cols[c]|=bit; boxes[b]|=bit; }
  let count=0, first=null;
  (function rec(){
    let best=-1, bestMask=0, bestCnt=10;
    for(let i=0;i<81;i++){ if(g[i]) continue;
      const [r,c]=RC(i), m=~(rows[r]|cols[c]|boxes[BOX(i)])&0x3FE, n=POP(m);
      if(n===0) return; if(n<bestCnt){best=i;bestMask=m;bestCnt=n; if(n===1)break;} }
    if(best<0){ count++; if(!first) first=g.slice(); return; }
    const [r,c]=RC(best), b=BOX(best);
    let ds=[]; for(let d=1;d<=9;d++) if(bestMask&(1<<d)) ds.push(d);
    if(rand) for(let k=ds.length-1;k>0;k--){const j=Math.floor(rand()*(k+1));[ds[k],ds[j]]=[ds[j],ds[k]];}
    for(const d of ds){ const bit=1<<d; g[best]=d; rows[r]|=bit; cols[c]|=bit; boxes[b]|=bit;
      rec(); g[best]=0; rows[r]&=~bit; cols[c]&=~bit; boxes[b]&=~bit; if(count>=limit) return; }
  })();
  return { count, first };
}
function makePuzzle(levelNo, seed){
  const rand = mulberry(seed), prof = LEVELS[levelNo-1];
  const sol = search(Array(81).fill(0), 1, rand).first;
  const given = sol.slice(); let clues = 81;
  const order = [...Array(81).keys()];
  for(let k=80;k>0;k--){const j=Math.floor(rand()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  for(const i of order){ if(clues<=prof.clues) break;
    const keep=given[i]; given[i]=0;
    if(search(given,2).count!==1) given[i]=keep; else clues--; }
  const empties = given.filter(v=>!v).length;
  const jitter = Math.floor(rand()*5)-2; // hides the exact correction room
  return { sol, given, limit: empties + Math.max(3, prof.room + jitter) };
}

/* ===== Persistence ===== */
const KEY = "earth-core-sudoku-save-v1";
function freshSave(){
  const inv={}; POWERS.forEach(p=>inv[p]=CONFIG.testSave.powers);
  return { v:1, lives:CONFIG.testSave.lives, coins:CONFIG.testSave.coins, inv, unlimitedUntil:0,
    regen:{ idx:0, start:null }, level:1, attempt:null, lastSeed:0, sliceDone:false,
    settings:{ sound:true, haptics:true, reduced:false }, activeMs:0, livesGiven:0, seenIntro:false };
}
let S;
try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : null; } catch(e){ S = null; }
if(!S || S.v!==1) S = freshSave();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ===== Time systems ===== */
const now = () => Date.now();
const unlimited = () => S.unlimitedUntil > now();
function tickRegen(t){
  const r = S.regen;
  if(S.lives >= CONFIG.maxLives){ S.lives = CONFIG.maxLives; r.idx=0; r.start=null; return; }
  while(r.start!=null && S.lives < CONFIG.maxLives){
    const need = CONFIG.regenMinutes[r.idx]*60000;
    if(t < r.start+need) break;
    S.lives++; r.start += need; r.idx++;
    if(S.lives >= CONFIG.maxLives){ r.idx=0; r.start=null; }
    else if(r.idx >= CONFIG.regenMinutes.length){ r.idx=0; r.start=null; } // cycle complete, no loop
  }
}
function lifeDropped(t){ if(S.regen.start==null){ S.regen.idx=0; S.regen.start=t; } }
function nextLifeMs(){ const r=S.regen; if(r.start==null||S.lives>=CONFIG.maxLives) return null; return r.start + CONFIG.regenMinutes[r.idx]*60000 - now(); }
function fmt(ms){ ms=Math.max(0,ms); const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`; }
function grantUnlimited(min){ const t=now(); S.unlimitedUntil = Math.max(S.unlimitedUntil, t) + min*60000; }

/* ===== Attempt lifecycle ===== */
function newAttempt(levelNo){
  let seed; do { seed = (Math.random()*2**31)|0; } while(seed===S.lastSeed);
  S.lastSeed = seed;
  const p = makePuzzle(levelNo, seed);
  S.attempt = { level:levelNo, seed, given:p.given, sol:p.sol, val:Array(81).fill(0), lock:Array(81).fill(false),
    notes:Array(81).fill(0), notesOn:false, pencil:false, moves:p.limit, limit:p.limit,
    startedAt:now(), interrupted:false, oom:false, won:false };
  sel = p.given.findIndex(v=>!v);
  save();
}
const A = () => S.attempt;
const valueAt = i => A().given[i] || A().val[i];
const isOpen = i => !A().given[i] && !A().lock[i];   // eligible for player edits and power targets
const boardFull = () => { for(let i=0;i<81;i++) if(!valueAt(i)) return false; return true; };
const boardCorrect = () => { for(let i=0;i<81;i++) if(valueAt(i)!==A().sol[i]) return false; return true; };

/* ===== Audio + haptics hooks ===== */
let ac=null;
function tone(f, d=.08, type="sine", vol=.12, slide=0){
  if(!S.settings.sound) return;
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const SFX = {
  place(){ tone(520,.09,"triangle",.14,1.4); },
  erase(){ tone(300,.07,"sine",.1,.7); },
  power(){ tone(220,.35,"sawtooth",.08,3); setTimeout(()=>tone(880,.2,"triangle",.1,1.5),120); },
  outOfMoves(){ tone(330,.25,"triangle",.12,.6); setTimeout(()=>tone(220,.35,"triangle",.12,.6),180); },
  notQuite(){ tone(260,.16,"square",.06,.9); setTimeout(()=>tone(230,.2,"square",.06,.9),140); },
  complete(){ [523,659,784,1046].forEach((f,k)=>setTimeout(()=>tone(f,.22,"triangle",.13),k*110)); },
  button(){ tone(700,.04,"sine",.06); },
  blocked(){ tone(160,.06,"square",.05); }
};
function buzz(p){ if(S.settings.haptics && navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }

/* ===== UI refs ===== */
const $ = id => document.getElementById(id);
const boardEl=$("board"), powersEl=$("powers"), padEl=$("pad"), layer=$("layer");
let sel = 0, armed = null, arrowAxis = null;
const cells=[];
for(let i=0;i<81;i++){ const d=document.createElement("div"); d.className="cell"; d.setAttribute("role","gridcell"); d.dataset.i=i; boardEl.appendChild(d); cells.push(d); }
boardEl.addEventListener("pointerdown", e=>{ const c=e.target.closest(".cell"); if(c) tapCell(+c.dataset.i); });

POWERS.forEach(p=>{ const b=document.createElement("button"); b.className="pw"; b.id="pw-"+p; b.innerHTML=ICON[p]+`<em>${POWER_LABEL[p]}</em><span class="n"></span>`; b.addEventListener("click",()=>usePower(p)); b.setAttribute("aria-label",POWER_LABEL[p]); powersEl.appendChild(b); });
for(let d=1;d<=9;d++){ const b=document.createElement("button"); b.className="key"; b.textContent=d; b.addEventListener("click",()=>inputDigit(d)); padEl.appendChild(b); }
{ const b=document.createElement("button"); b.className="key erase"; b.innerHTML=ICON.erase; b.setAttribute("aria-label","Erase"); b.addEventListener("click",erase); padEl.appendChild(b); }

/* ===== Rendering ===== */
function render(){
  const a=A(); if(!a) return;
  const sv = sel>=0 ? valueAt(sel) : 0, [sr,sc]=RC(sel), sb=BOX(sel);
  for(let i=0;i<81;i++){
    const el=cells[i], v=valueAt(i), [r,c]=RC(i);
    let cls="cell";
    if(a.given[i]) cls+=" given"; else if(a.lock[i]) cls+=" locked";
    if(i===sel && !armed) cls+=" sel";
    else if(!armed && sel>=0){ if(sv && v===sv) cls+=" same"; else if(r===sr||c===sc||BOX(i)===sb) cls+=" peer"; }
    if(armed) cls+=" target";
    const keep = el.className.match(/\b(pop|burst|win)\b/g);
    el.className = cls + (keep? " "+keep.join(" "):"");
    if(v){ if(el.dataset.v!==String(v)){ el.textContent=v; el.dataset.v=v; } }
    else if(a.notes[i]){ let h='<div class="notes">'; for(let d=1;d<=9;d++) h+=`<i>${a.notes[i]&(1<<d)?d:""}</i>`; el.innerHTML=h+"</div>"; el.dataset.v="n"+a.notes[i]; }
    else if(el.dataset.v!==""){ el.textContent=""; el.dataset.v=""; }
  }
  $("lvlTitle").textContent = "Level "+a.level;
  $("zone").textContent = LEVELS[a.level-1].zone;
  $("movesVal").textContent = a.moves;
  $("moves").classList.toggle("low", a.moves<=3);
  POWERS.forEach(p=>{ const b=$("pw-"+p); const n=S.inv[p];
    b.querySelector(".n").textContent = (p==="notes"&&a.notesOn) ? "ON" : n;
    b.classList.toggle("empty", n<=0 && !(p==="notes"&&a.notesOn));
    b.classList.toggle("armed", armed===p);
    b.classList.toggle("active-notes", p==="notes"&&a.notesOn&&a.pencil); });
  padEl.querySelectorAll(".key:not(.erase)").forEach(k=>k.classList.toggle("pencil", a.notesOn&&a.pencil));
  renderMode(); renderHud(); applyEnv(a.level);
}
function renderMode(){
  const m=$("mode"), a=A();
  if(armed==="arrow" && !arrowAxis){ m.innerHTML=`Arrow: clear a <button id="axR">Row</button><button id="axC">Column</button><button id="axX">Cancel</button>`;
    $("axR").onclick=()=>{arrowAxis="row";render();}; $("axC").onclick=()=>{arrowAxis="col";render();}; $("axX").onclick=disarm; return; }
  if(armed){ const what={hammer:"Tap a cell to hammer it",bomb:"Tap any cell in the 3×3 box to blast",arrow:`Tap a cell in the ${arrowAxis} to fire`}[armed];
    m.innerHTML=`${what} <button id="axX">Cancel</button>`; $("axX").onclick=disarm; return; }
  if(a.notesOn){ m.innerHTML=`<button id="mPen" class="${a.pencil?"on":""}">Notes ${a.pencil?"on":"off"}</button>`; $("mPen").onclick=()=>{a.pencil=!a.pencil;SFX.button();save();render();}; return; }
  m.innerHTML="";
}
function renderHud(){
  tickRegen(now());
  $("livesVal").textContent = unlimited() ? "∞" : S.lives;
  const chip=$("livesChip"), sub=$("livesSub");
  if(unlimited()){ chip.classList.add("unl"); sub.textContent = fmt(S.unlimitedUntil-now()); }
  else { chip.classList.remove("unl"); const n=nextLifeMs(); sub.textContent = n!=null ? fmt(n) : (S.lives>=CONFIG.maxLives?"Full":""); }

/* ===== Toast ===== */
let toastTimer;
function toast(title, sub="", ms=1500){
  $("toastT").textContent=title; $("toastS").textContent=sub; const t=$("toast"); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"), ms);
}
function flash(i, cls, delay=0){ const el=cells[i]; el.classList.remove(cls); void el.offsetWidth; el.style.setProperty("--d",delay+"ms"); el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), 800+delay); }

/* ===== Input ===== */
function blockedState(){ const a=A(); return !a || a.oom || a.won || layer.firstChild; }
function tapCell(i){
  if(blockedState()) return;
  if(armed){ firePower(i); return; }
  sel=i; render();
}
function inputDigit(d){
  if(blockedState()||armed) return;
  const a=A(), i=sel; if(i<0) return;
  if(!isOpen(i)){ SFX.blocked(); buzz(10); return; }
  if(a.notesOn && a.pencil){
    if(a.val[i]) { SFX.blocked(); return; }
    a.notes[i]^=(1<<d); SFX.button(); save(); render(); return;      // pencil marks cost 0 Moves
  }
  if(a.val[i]===d){ SFX.blocked(); buzz(10); return; }               // same-number re-entry blocked, 0 Moves
  a.val[i]=d; a.notes[i]=0; a.moves--;                                // empty entry or replacement: 1 Move
  SFX.place(); buzz(12); flash(i,"pop");
  const mv=$("moves"); mv.classList.remove("bump"); void mv.offsetWidth; mv.classList.add("bump");
  afterChange();
}
function erase(){
  if(blockedState()||armed) return;
  const a=A(), i=sel; if(i<0||!isOpen(i)) return;
  if(a.val[i]){ a.val[i]=0; SFX.erase(); buzz(8); }                   // 0 Moves
  else if(a.notes[i]){ a.notes[i]=0; SFX.erase(); }
  save(); render();
}
function afterChange(){
  const a=A();
  if(boardFull()){
    if(boardCorrect()){ win(); return; }
    SFX.notQuite(); buzz([30,40,30]);
    toast("NOT QUITE!","Some numbers need another look.",2000);
    boardEl.classList.remove("shake"); void boardEl.offsetWidth; boardEl.classList.add("shake");
  }
  if(a.moves<=0){ a.moves=0; a.oom=true; save(); render(); setTimeout(()=>{SFX.outOfMoves(); buzz([40,60,40]); showOutOfMoves();}, boardFull()?1300:250); return; }
  save(); render();
}

/* ===== Power-ups ===== */
function disarm(){ armed=null; arrowAxis=null; render(); }
function anyOpen(){ for(let i=0;i<81;i++) if(isOpen(i)) return true; return false; }
function usePower(p){
  if(blockedState()) return;
  const a=A();
  if(armed===p){ disarm(); return; }
  if(p==="notes"){
    if(a.notesOn){ a.pencil=!a.pencil; SFX.button(); save(); render(); return; }
    if(S.inv.notes<=0){ toast("No Notes left"); return; }
    S.inv.notes--; a.notesOn=true; a.pencil=true; SFX.power(); buzz(20);
    toast("Notes unlocked","Pencil marks are free for this attempt."); save(); render(); return;
  }
  if(S.inv[p]<=0){ toast(`No ${POWER_LABEL[p]} left`); return; }
  if(!anyOpen()){ toast("No eligible cells."); return; }             // not consumed
  if(p==="reveal"){
    const digits=[]; for(let d=1;d<=9;d++){ for(let i=0;i<81;i++) if(isOpen(i)&&a.sol[i]===d){digits.push(d);break;} }
    if(!digits.length){ toast("No eligible cells."); return; }
    const d=digits[Math.floor(Math.random()*digits.length)];
    const hits=[]; for(let i=0;i<81;i++) if(isOpen(i)&&a.sol[i]===d) hits.push(i);
    applyCorrections(hits,"reveal"); toast(`Revealed ${d}s`, `${hits.length} cell${hits.length>1?"s":""} locked in.`); return;
  }
  armed=p; arrowAxis=null; SFX.button(); render();
}
function firePower(i){
  const a=A(), [r,c]=RC(i); let targets=[];
  if(armed==="hammer") targets=[i];
  else if(armed==="bomb"){ const b=BOX(i); for(let k=0;k<81;k++) if(BOX(k)===b) targets.push(k); }
  else if(armed==="arrow"){ if(!arrowAxis) return; for(let k=0;k<9;k++) targets.push(arrowAxis==="row"? r*9+k : k*9+c); }
  const hits=targets.filter(isOpen);
  if(!hits.length){ toast("No eligible cells.","Pick a spot with open cells."); SFX.blocked(); return; } // not consumed
  const p=armed; armed=null; arrowAxis=null; sel=i;
  applyCorrections(hits,p, i);
}
function applyCorrections(hits, p, origin){
  const a=A(); S.inv[p]--;
  const [or,oc]= origin!=null? RC(origin) : [4,4];
  hits.forEach(k=>{ a.val[k]=a.sol[k]; a.lock[k]=true; a.notes[k]=0; const [r,c]=RC(k); flash(k,"burst", (Math.abs(r-or)+Math.abs(c-oc))*45); });
  SFX.power(); buzz([20,30,50]); sparks(hits);
  save(); render();                                                   // 0 Moves
  if(boardFull()) setTimeout(afterChange, 500);
}

    <p class="sub" style="margin-top:14px">Jump to level (starts a fresh puzzle)</p>
    <div class="levels" id="dLv">${lv}</div>
    <div class="stack"><button class="btn cool" id="dReset">${resetArm?"Tap again to erase all progress":"Reset progress"}</button><button class="btn hot" id="dClose">Done</button></div>
    <p class="sub">Lives ${S.lives}/5 · Coins ${S.coins.toLocaleString("en-US")} · ${POWERS.map(p=>POWER_LABEL[p]+" "+S.inv[p]).join(" · ")}</p>`);
  $("dCoins").onclick=()=>{ S.coins+=1000; save(); showDev(); };
  $("dPow").onclick=()=>{ POWERS.forEach(p=>S.inv[p]=Math.min(CONFIG.powerCap,S.inv[p]+1)); save(); showDev(); };
  $("dLm").onclick=()=>{ if(S.lives>0){ S.lives--; lifeDropped(now()); } save(); showDev(); };
  $("dLp").onclick=()=>{ S.lives=Math.min(CONFIG.maxLives,S.lives+1); tickRegen(now()); save(); showDev(); };
  $("dUnl").onclick=()=>{ grantUnlimited(CONFIG.unlimitedRewardMin); save(); showDev(); };
  $("dOom").onclick=()=>{ const a=A(); a.moves=0; a.oom=true; a.won=false; save(); layer.innerHTML=""; render(); showOutOfMoves(); };
  $("dLv").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; S.level=+b.dataset.l; newAttempt(S.level); closeSheet(); };
  $("dReset").onclick=()=>{ if(!resetArm){ resetArm=true; showDev(); setTimeout(()=>resetArm=false,4000); return; } resetArm=false; S=freshSave(); S.seenIntro=true; newAttempt(1); closeSheet(); };
  $("dClose").onclick=()=>{ closeSheet(); if(A().oom) showOutOfMoves(); };
}
$("menuBtn").onclick=()=>{ if(A()&&A().oom) return showOutOfMoves(); SFX.button(); showMenu(); };
if(DEV_TOOLS){ let ht; const h=$("titleHold");
  h.addEventListener("pointerdown",()=>{ ht=setTimeout(()=>{ buzz(30); showDev(); },700); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>h.addEventListener(ev,()=>clearTimeout(ht))); }

/* keyboard for desktop testing */
document.addEventListener("keydown",e=>{
  if(layer.firstChild) return;
  if(e.key>="1"&&e.key<="9") inputDigit(+e.key);
  else if(e.key==="Backspace"||e.key==="Delete"||e.key==="0") erase();
  else if(e.key==="Escape") disarm();
  else { const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key]; if(mv){ e.preventDefault(); sel=(sel+mv+81)%81; render(); } }
});

/* ===== Environment canvas ===== */
const cv=$("env"), ctx=cv.getContext("2d"); let W=0,H=0,DPR=1, envLevel=0, envP=null, embers=[], cracks=[], crystals=[], rocksL=[], rocksR=[];
function profile(l){
  const z=LEVELS[l-1].zone, k=(l-1)/9;
  if(z==="Deep Molten Core") return { top:"#1c0703", bot:"#6a1804", glow:[255,118,28], heat:1-k*.4, embers:70, crystals:0, rock:"#140504" };
  if(z==="Magma Chambers") return { top:"#170605", bot:"#561208", glow:[255,84,38], heat:.85, embers:55, crystals:0, rock:"#120504" };
  if(z==="Cooling Volcanic Rock") return { top:"#100b0b", bot:"#33201a", glow:[232,96,42], heat:.55-(l-6)*.06, embers:32, crystals:0, rock:"#0d0808" };
  return { top:"#0c0a14", bot:"#2a1620", glow:[236,104,52], heat:.38, embers:22, crystals:1, rock:"#0b0810" };
}
function applyEnv(l){
  if(l===envLevel) return; envLevel=l; envP=profile(l);
  document.documentElement.style.setProperty("--glow", envP.glow.join(","));
  seedScene();
}
function seedScene(){
  const r=mulberry(envLevel*7919+13);
  embers=[...Array(envP.embers)].map(()=>({x:r()*W,y:r()*H,v:.15+r()*.5,s:.6+r()*1.8,p:r()*6.28,a:.3+r()*.6}));
  cracks=[...Array(6)].map(()=>{ let x=r()*W, y=H*(.72+r()*.25); const pts=[[x,y]]; for(let k=0;k<7;k++){ x+= (r()-.5)*70; y+= (r()-.3)*28; pts.push([x,y]); } return pts; });
  const jag=(side)=>{ const pts=[]; const base= side? W : 0; for(let y=-20;y<=H+20;y+=28+r()*30){ const d=18+r()*Math.min(70,W*.12); pts.push([side? base-d : base+d, y]); } return pts; };
  rocksL=jag(0); rocksR=jag(1);
  crystals = envP.crystals ? [...Array(9)].map(()=>{ const side=r()<.5; return { x: side? r()*W*.18 : W-r()*W*.18, y:H*(.15+r()*.75), h:24+r()*60, w:8+r()*14, t:(r()-.5)*.7, hue: r()<.5? "160,220,255":"200,150,255" }; }) : [];
}
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); if(envP) seedScene(); }
addEventListener("resize",resize);
let sparkList=[];
function sparks(idx){
  if(motionOff()) return;
  const br=boardEl.getBoundingClientRect();
  idx.forEach(i=>{ const [r,c]=RC(i); const x=br.left+(c+.5)*br.width/9, y=br.top+(r+.5)*br.height/9;
    for(let k=0;k<6;k++){ const a=Math.random()*6.28, s=1+Math.random()*3; sparkList.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,l:1}); } });
}
function motionOff(){ return S.settings.reduced || matchMedia("(prefers-reduced-motion: reduce)").matches; }
function applyMotion(){ document.documentElement.classList.toggle("rm", S.settings.reduced); }
function frame(ts){
  if(!envP){ requestAnimationFrame(frame); return; }
  const t=ts/1000, still=motionOff(), P=envP, [gr,gg,gb]=P.glow;
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,P.top); g.addColorStop(1,P.bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // molten pool glow
  const pulse= still? 1 : 1+Math.sin(t*.8)*.08;
  const rg=ctx.createRadialGradient(W/2,H*1.05,10,W/2,H*1.05,Math.max(W,H)*.75*pulse);
  rg.addColorStop(0,`rgba(${gr},${gg},${gb},${.75*P.heat})`); rg.addColorStop(.45,`rgba(${gr},${Math.max(0,gg-40)},${gb},${.22*P.heat})`); rg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  // slow magma blobs
  for(let k=0;k<3;k++){ const bx=W*(.2+.3*k)+(still?0:Math.sin(t*.15+k*2)*40), by=H*(.9+.05*Math.sin(t*.2+k)); const bg=ctx.createRadialGradient(bx,by,0,bx,by,140);
    bg.addColorStop(0,`rgba(255,${150-k*20},40,${.18*P.heat})`); bg.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=bg; ctx.fillRect(bx-140,by-140,280,280); }
  // rock walls with parallax
  const off = still?0:Math.sin(t*.1)*4;
  [rocksL,rocksR].forEach((pts,side)=>{ ctx.beginPath(); ctx.moveTo(side?W:0,-20); pts.forEach(([x,y])=>ctx.lineTo(x+(side?-off:off),y)); ctx.lineTo(side?W:0,H+20); ctx.closePath(); ctx.fillStyle=P.rock; ctx.fill();
    ctx.strokeStyle=`rgba(${gr},${gg},${gb},${.35*P.heat})`; ctx.lineWidth=1.5; ctx.stroke(); });
  // glowing cracks
  const ca= .35+.25*(still?0:Math.sin(t*1.3));
  ctx.lineCap="round"; ctx.lineJoin="round";
  cracks.forEach((pts,k)=>{ ctx.beginPath(); pts.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y));
    ctx.strokeStyle=`rgba(${gr},${gg+40},${gb},${(ca+.1*(k%2))*P.heat})`; ctx.lineWidth=2.2; ctx.shadowColor=`rgba(${gr},${gg},${gb},.9)`; ctx.shadowBlur=12; ctx.stroke(); ctx.shadowBlur=0; });
  // crystals
  crystals.forEach((c,k)=>{ ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.t); const sh= still?.6:.5+.25*Math.sin(t*1.1+k);
    ctx.beginPath(); ctx.moveTo(0,-c.h); ctx.lineTo(c.w/2,-c.h*.7); ctx.lineTo(c.w/2,0); ctx.lineTo(-c.w/2,0); ctx.lineTo(-c.w/2,-c.h*.7); ctx.closePath();
    ctx.fillStyle=`rgba(${c.hue},${.18+sh*.2})`; ctx.shadowColor=`rgba(${c.hue},.8)`; ctx.shadowBlur=14; ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=`rgba(${c.hue},.6)`; ctx.lineWidth=1; ctx.stroke(); ctx.restore(); });
  // embers
  embers.forEach(e=>{ if(!still){ e.y-=e.v; e.x+=Math.sin(t+e.p)*.25; if(e.y<-10){ e.y=H+10; e.x=Math.random()*W; } }
    const fl= still? e.a : e.a*(.6+.4*Math.sin(t*3+e.p)); ctx.fillStyle=`rgba(255,${170+((e.p*30)|0)%60},80,${fl*P.heat+.08})`;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.s,0,6.28); ctx.fill(); });
  // power-up sparks
  sparkList=sparkList.filter(s=>s.l>0); sparkList.forEach(s=>{ s.x+=s.vx; s.y+=s.vy; s.vy+=.08; s.l-=.025; });
  requestAnimationFrame(frame);
}
// sparks must draw above the board: second canvas layer would be heavier; instead draw sparks on a top overlay
const top=document.createElement("canvas"); top.style.cssText="position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none"; document.body.appendChild(top);
const tctx=top.getContext("2d");
function topFrame(){
  if(top.width!==W*DPR||top.height!==H*DPR){ top.width=W*DPR; top.height=H*DPR; }
  tctx.setTransform(DPR,0,0,DPR,0,0); tctx.clearRect(0,0,W,H);
  if(sparkList.length){ sparkList.forEach(s=>{ tctx.fillStyle=`rgba(255,210,100,${Math.max(0,s.l)})`; tctx.beginPath(); tctx.arc(s.x,s.y,2.4*s.l+.6,0,6.28); tctx.fill(); }); }
  requestAnimationFrame(topFrame);
}

/* ===== Clock: regen, unlimited, active play time, interruption ===== */
let lastTick=now();
setInterval(()=>{
  const t=now(), dt=t-lastTick; lastTick=t;
  if(document.visibilityState==="visible" && A() && !A().won && !layer.querySelector(".toggle")) S.activeMs += Math.min(dt,2000);
  const before=S.lives; renderHud();
  if(layer.firstChild && A() && A().oom && S.lives!==before) showOutOfMoves();
  else if(layer.firstChild && A() && A().oom){ const n=$("oomNote"); const nl=nextLifeMs(); if(n && playAgainCost().kind==="coins" && !playAgainCost().ok) n.textContent="Next Life in "+(nl!=null?fmt(nl):"—")+"."; }
  if(t%5000<1000) save();
},1000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ if(A()&&!A().won) A().interrupted=true; save(); } });

/* ===== Boot ===== */
resize(); applyMotion();
tickRegen(now());
if(!S.attempt){ newAttempt(S.level||1); } else { sel=A().given.findIndex(v=>!v); if(sel<0) sel=0; }
render(); requestAnimationFrame(frame); requestAnimationFrame(topFrame);
if(A().won){ A().won=false; S.level=Math.min(A().level+1,LEVELS.length); newAttempt(S.level); render(); }
if(!S.seenIntro) showIntro(); else if(A().oom) showOutOfMoves();
})();
</script>
</body>
